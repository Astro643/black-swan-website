name: Deploy Black Swan Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "src/types/database.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-swan-edge-functions-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy Supabase functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The repository currently has no package-lock.json, so npm ci would fail.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID."
            exit 1
          fi

          for function in loan-interest market-sync wealth-tax; do
            if [[ ! -f "functions/${function}/index.ts" ]]; then
              echo "::error::Missing functions/${function}/index.ts."
              exit 1
            fi
          done

      - name: Prepare Supabase function directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions

          # Supabase CLI expects functions under supabase/functions/.
          # Keep the existing source layout under /functions unchanged.
          for function in loan-interest market-sync wealth-tax; do
            mkdir -p "supabase/functions/${function}"
            cp -R "functions/${function}/." "supabase/functions/${function}/"
          done

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for function in loan-interest market-sync wealth-tax; do
            echo "Deploying ${function}..."
            supabase functions deploy "${function}" \
              --project-ref "${SUPABASE_PROJECT_ID}"
          done
